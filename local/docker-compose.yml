# ชุดฐานข้อมูลสำหรับรันในเครื่อง: PostgreSQL + PostgREST + nginx (ทำให้ URL เป็น /rest/v1/ ตามที่ supabase-js ต้องการ)
# สร้างไฟล์ .env ด้วย: node local/make-env.js
# เริ่ม: docker compose --env-file local/.env -f local/docker-compose.yml up -d
name: smartpos-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smartpos
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ไฟล์ใน initdb.d รันตามลำดับชื่อ เฉพาะตอนสร้างฐานข้อมูลครั้งแรก
      - ./db/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ../database_master_setup.sql:/docker-entrypoint-initdb.d/01-master-setup.sql:ro
      - ./db/02-lock-anon.sql:/docker-entrypoint-initdb.d/02-lock-anon.sql:ro
      - ./db/03-held-bills-shop-id.sql:/docker-entrypoint-initdb.d/03-held-bills-shop-id.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartpos"]
      interval: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator_pw@db:5432/smartpos
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:80"
    depends_on: [postgrest]

volumes:
  pgdata:
